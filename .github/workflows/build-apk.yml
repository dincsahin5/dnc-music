name: Build DNC MUSIC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Android 36 SDK and Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle.log || { echo "=== GRADLE ERROR ==="; tail -n 80 ../gradle.log; exit 1; }

      - name: Upload DNC MUSIC APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNC-MUSIC-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to GitHub Releases
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dnc-music.apk
          gh release delete v1.0.0 --cleanup-tag -y || true
          gh release create v1.0.0 dnc-music.apk --title "DNC MUSIC v1.0.0 APK" --notes "DNC MUSIC Android Uygulamasını doğrudan indirmek için aşağıdaki dnc-music.apk dosyasına tıklayın."
