name: Build DNC MUSIC APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Android 36 SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Web Assets to Android App
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dnc-music-v1.0.apk

      - name: Upload DNC MUSIC APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNC-MUSIC-Debug-APK
          path: dnc-music-v1.0.apk

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "DNC MUSIC v1.0.0 (Android APK)"
          body: |
            ## 🎸 DNC MUSIC - Sahne & Repertuvar Sistemi
            Müzisyenler için özel tasarlanmış profesyonel sahne konsolu ve repertuvar sistemi.
            
            ### 📲 İndirme:
            Aşağıdaki **`dnc-music-v1.0.apk`** dosyasına tıklayarak doğrudan telefonunuza indirebilirsiniz!
          files: dnc-music-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
